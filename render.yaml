services:
  - type: web
    name: npm-install--g-eas-cli
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: calculadora_precios
      - key: MONGO_TIMEOUT_MS
        value: "5000"
